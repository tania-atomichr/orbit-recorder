<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide</title>
<link rel="stylesheet" href="src/ui.css">
<style>
  .hero { padding: 22px 24px; margin-bottom: 22px; }
  .title { width: 100%; border: 1px solid transparent; border-radius: 10px; padding: 4px 8px; margin: 0 0 10px -9px;
           font-size: 28px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; color: var(--ink); background: transparent;
           resize: none; overflow: hidden; display: block; }
  .title:hover, .title:focus { border-color: var(--line); background: var(--bg); }
  .hero .bar.facts { margin-bottom: 18px; }
  .intro { width: 100%; border: 1px solid transparent; border-radius: 10px; padding: 4px 8px; margin: -4px 0 12px -9px; font-size: 16px; color: var(--soft);
           background: transparent; resize: none; overflow: hidden; display: block; line-height: 1.5; }
  .intro:hover, .intro:focus { border-color: var(--line); background: var(--bg); outline: none; }
  #worknote, #sentlist { margin-top: 14px; }
  #sentlist { display: grid; gap: 8px; } #sentlist:empty { display: none; }
  .grow { flex: 1; } .small { font-size: 13px; }
  .picked { position: sticky; top: 10px; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 14px; margin-bottom: 14px; font-weight: 600; }
  .stepbar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .tool { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--soft); font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 6px 10px; border-radius: 999px; }
  .tool:hover { color: var(--accent-ink); background: var(--accent-soft); }
  .tool svg { width: 16px; height: 16px; }
  .tool:disabled { opacity: .35; cursor: default; background: none; }
  .pick { width: 18px; height: 18px; margin: 8px 0 0; accent-color: var(--accent); }
  .grip { cursor: grab; color: var(--soft); padding: 6px 0; background: none; border: 0; }
  li.step.drag { opacity: .4; } li.step.over { box-shadow: 0 -3px 0 var(--accent); }
  li.step.chosen { box-shadow: 0 0 0 2px var(--accent); }
  .tipbox { width: 100%; border: 0; border-radius: 10px; padding: 9px 12px; background: var(--yellow-soft); color: var(--ink); resize: none; overflow: hidden; display: block; margin: 0 0 12px; line-height: 1.45; }
  .tipbox:focus { outline: 2px solid var(--yellow); }
  .tipbox::placeholder { color: #8a6a1f; }
  .addhere { display: flex; justify-content: center; margin: -8px 0; position: relative; z-index: 1; }
  .addhere button { opacity: 0; transition: opacity .15s; }
  .addhere:hover button, .addhere button:focus { opacity: 1; }
  .addend { margin-top: 18px; }
  dialog.box.wide { width: min(1100px, calc(100vw - 32px)); }
  .canvasbox { background: var(--bg); border-radius: 12px; overflow: auto; max-height: 62vh; }
  .canvasbox canvas { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: none; }
  .pill.soft.on { background: var(--accent); color: #fff; }
  #steps { gap: 14px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; counter-reset: s; }
  li.step { padding: 16px; }
  .head { display: grid; grid-template-columns: auto 34px minmax(0, 1fr) auto; gap: 12px; align-items: start; margin-bottom: 12px; }
  .num { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .say { width: 100%; border: 1px solid transparent; border-radius: 10px; padding: 5px 8px; margin-left: -8px; font-size: 16px; font-weight: 600; color: var(--ink);
         background: transparent; resize: none; overflow: hidden; display: block; line-height: 1.4; }
  .say:hover, .say:focus { border-color: var(--line); background: var(--bg); }
  .out { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--soft); font-size: 13.5px; font-weight: 600;
         cursor: pointer; padding: 7px 10px; border-radius: 999px; }
  .out:hover { color: var(--bad); background: var(--bad-soft); }
  .out svg { width: 16px; height: 16px; }
  .pic { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
  .pic img { display: block; width: 100%; height: auto; }
  .ring { position: absolute; border: 3px solid var(--accent); border-radius: 8px; box-shadow: 0 0 0 5px rgba(145, 64, 176, .22); pointer-events: none; }
  .pic img.over { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pic img.f, .ring { transition: opacity .25s; }
  .tag { position: absolute; left: 10px; bottom: 10px; background: rgba(15, 23, 42, .78); color: #fff; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 9px; }
  .where { margin-top: 10px; max-width: 100%; }
  .where span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 520px) {
    .hero { padding: 18px 16px; }
    .title { font-size: 23px; }
    .head { grid-template-columns: auto 30px minmax(0, 1fr); gap: 8px; } .head .grip { display: none; }
    .num { width: 30px; height: 30px; font-size: 14px; }
    .out span { display: none; }
    .bar.acts .pill { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<header class="brand">
  <a class="home" href="library.html"><img src="icons/icon-48.png" alt="">Orbit Recorder</a>
  <nav class="nav"><a href="library.html"><i data-icon="list"></i><span>Library</span></a><a href="options.html"><i data-icon="cog"></i><span>Settings</span></a></nav>
</header>
<div class="wrap">
  <p class="note" id="missing" hidden><i data-icon="alert"></i>This guide is not in this browser any more.</p>
  <div id="page" hidden>
    <section class="card hero">
      <textarea class="title" id="title" rows="1" aria-label="Title"></textarea>
      <textarea class="intro" id="intro" rows="1" aria-label="Intro" placeholder="Add an intro: what the reader will get done"></textarea>
      <div class="bar facts" id="facts"></div>
      <div class="bar acts">
        <div class="menu" id="sendmenu"><button class="pill accent" id="send" type="button"><i data-icon="send"></i>Send</button></div>
        <div class="menu" id="dlmenu"><button class="pill line" id="dl" type="button"><i data-icon="download"></i>Download</button></div>
        <button class="pill line" id="write" type="button"><i data-icon="wand"></i><span>Write it for me</span></button>
        <button class="pill line" id="undo" type="button" disabled><i data-icon="undo"></i><span>Undo</span></button>
        <div class="menu" id="moremenu"><button class="pill line" id="more" type="button"><i data-icon="grip"></i>More</button></div>
      </div>
      <div class="note" id="worknote" hidden></div>
      <div id="sentlist"></div>
    </section>
    <div class="card picked" id="picked" hidden>
      <span id="pickedn"></span><span class="grow"></span>
      <button class="pill small line" id="pickclear" type="button">Clear</button>
      <button class="pill small danger" id="pickdel" type="button"><i data-icon="trash"></i>Delete these steps</button>
    </div>
    <ol id="steps"></ol>
    <button class="addend pill soft" id="addend" type="button"><i data-icon="plus"></i>Add a step at the end</button>
  </div>
</div>

<dialog class="box wide" id="editor">
  <div class="in">
    <h2>Edit the picture</h2>
    <div class="bar">
      <button class="pill small soft on" data-mode="cover" type="button"><i data-icon="cover"></i>Cover a part</button>
      <button class="pill small soft" data-mode="ring" type="button"><i data-icon="ring"></i>Draw the ring</button>
      <button class="pill small line" id="noring" type="button"><i data-icon="x"></i>No ring</button>
      <button class="pill small line" id="picundo" type="button" disabled><i data-icon="undo"></i>Undo</button>
    </div>
    <p class="muted small" id="pichelp">Drag over anything private: a name, an email, a number. It is painted over for good, in the picture and its clip.</p>
    <div class="canvasbox"><canvas id="canvas"></canvas></div>
    <div class="bar"><span class="grow"></span><button class="pill line" id="piccancel" type="button">Cancel</button><button class="pill accent" id="picsave" type="button">Save the picture</button></div>
  </div>
</dialog>
<dialog class="box" id="dialog"><div class="in" id="dialogin"></div></dialog>

<script src="src/icons.js"></script>
<script src="src/store.js"></script>
<script src="src/format.js"></script>
<script src="src/templates.js"></script>
<script src="src/providers.js"></script>
<script src="src/destinations.js"></script>
<script src="src/clip.js"></script>
<script src="src/export.js"></script>
<script src="src/outbox.js"></script>
<script src="src/guide-page.js"></script>
</body>
</html>
